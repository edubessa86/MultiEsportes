type Query {
  ping: String
  sports: [Sport!]!
  modalities: [Modality!]!
  modality(id: ID!): Modality
  seasons: [Season!]!
  catalog: Catalog!
  me: User
  viewer: User
  user(id: ID!): User
  mySessions(limit: Int, offset: Int): [Session!]!
  ranking(sportId: ID!, period: String!): [RankingEntry!]!
}

type Mutation {
  ping: String
  login(input: LoginInput!): AuthPayload!
  register(input: RegisterInput!): AuthPayload!
  createSession(input: SessionInput!): Session!
}

type Sport {
  id: ID!
  name: String!
  description: String
}

type Modality {
  id: ID!
  name: String!
  sportId: ID!
}

type Season {
  id: ID!
  name: String!
  active: Boolean!
}

type Catalog {
  sports: [Sport!]!
  modalities: [Modality!]!
  seasons: [Season!]!
}

type User {
  id: ID!
  email: String!
  name: String!
}

type Session {
  id: ID!
  sportId: ID!
  duration: Int!
  createdAt: String!
}

type RankingEntry {
  userId: ID!
  userName: String!
  score: Float!
  position: Int!
}

input LoginInput {
  email: String!
  password: String!
}

input RegisterInput {
  email: String!
  password: String!
  name: String!
}

input SessionInput {
  sportId: ID!
  duration: Int!
}

type AuthPayload {
  token: String!
  user: User!
}
