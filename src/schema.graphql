}

input UserModalityInput {
  modalityId: Int!
  primaryPositionId: ID
  dominantSide: String
  level: String
  isFavorite: Boolean
}

input RankingLocationInput {
  countryCode: String
  admin1: String
  admin2: String
}

input SyncSessionInput {
  clientSessionId: UUID!
  modalityId: Int!
  source: TrackingSource!
  startedAt: DateTime!
  endedAt: DateTime!
  metrics: [SessionMetricInput!]!
  trackPoints: [TrackPointInput!]
