scalar DateTime
scalar UUID
scalar JSON

type Query {
  ping: String
  sports(lang: Language): [Sport!]!
  modalities(sportSlug: String, lang: Language): [Modality!]!
  modality(slug: String!, lang: Language): Modality
  catalog(lang: Language): Catalog!
  viewer: User
  user(id: ID!): User
  myConsents: [Consent!]!
  mySessions(
    modalityId: Int
    status: SessionStatus
    from: DateTime
    to: DateTime
    first: Int = 20
    after: String
  ): SessionConnection!
  session(id: UUID!): Session
  seasons(organizationId: UUID): [Season!]!
  performanceRanking(
    modalityId: Int!
    seasonId: Int!
    first: Int = 50
    offset: Int = 0
    location: RankingLocationInput
  ): PerformanceRanking!
  xpRanking(
    seasonId: Int
    modalityId: Int
    first: Int = 50
    offset: Int = 0
  ): XpRanking!
}

type Mutation {
  signUp(input: SignUpInput!): AuthPayload!
  signIn(input: SignInInput!): AuthPayload!
  refreshSession(refreshToken: String!): AuthPayload!
  signOut(refreshToken: String!): SimplePayload!
  updateProfile(input: UpdateProfileInput!): UserPayload!
  upsertUserModality(input: UserModalityInput!): UserPayload!
  removeUserModality(modalityId: Int!): UserPayload!
  recordConsent(
    kind: String!
    version: String!
    granted: Boolean!
  ): SimplePayload!
  syncSession(input: SyncSessionInput!): SyncSessionPayload!
  disputeSession(sessionId: UUID!, message: String!): SimplePayload!
  createSession(input: SessionInput!): Session!
}

enum Language {
  PT_BR
  EN
}

enum SessionStatus {
  RECORDING
  PROCESSING
  VALID
  INVALID
  DISPUTED
}

enum TrackingSource {
  GPS
  IMU
  MANUAL
  WEAR_OS
  HR_SENSOR
  DERIVED
}

enum SessionOutcome {
  WIN
  DRAW
  LOSS
}

type Sport {
  id: ID!
  slug: String!
  name: String!
  icon: String
  modalities: [Modality!]!
}

type Modality {
  id: Int!
  slug: String!
  name: String!
  sportId: Int!
  sport: Sport!
  gpsRecommended: Boolean!
  imuRecommended: Boolean!
  minValidDurationMin: Int!
  periodKind: String!
  metrics: [ModalityMetric!]!
}

type ModalityMetric {
  isPrimary: Boolean!
  weight: Float!
  metric: Metric!
}

type Metric {
  code: String!
  name: String!
  unit: String!
}

type Catalog {
  modalities: [Modality!]!
  seasons: [Season!]!
}

type Season {
  id: Int!
  name: String!
  startDate: String
  endDate: String
}

type User {
  id: ID!
  email: String!
  fullName: String!
  displayName: String
  xpTotal: Int!
  isPremium: Boolean!
  birthdate: String
  locale: String
  pictureUrl: String
  location: UserLocation
  guardian: User
  teams: [Team!]!
  organizations: [Organization!]!
  modalities: [UserModality!]!
}

type UserLocation {
  countryCode: String
  admin1: String
  admin2: String
}

type UserModality {
  modality: Modality!
  primaryPosition: Position
  dominantSide: String
  level: String
  isFavorite: Boolean!
}

type Position {
  id: ID!
  code: String!
  name: String!
}

type Team {
  id: ID!
  name: String!
}

type Organization {
  id: ID!
  name: String!
}

type Consent {
  kind: String!
  version: String!
  granted: Boolean!
  createdAt: DateTime!
}

type AuthPayload {
  accessToken: String
  refreshToken: String
  expiresAt: DateTime
  viewer: User
  userErrors: [UserError!]!
}

type UserPayload {
  user: User
  userErrors: [UserError!]!
}

type UserError {
  code: String!
  message: String!
  field: [String!]
}

type SimplePayload {
  success: Boolean!
  userErrors: [UserError!]!
}

type SessionConnection {
  totalCount: Int!
  pageInfo: PageInfo!
  edges: [SessionEdge!]!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type SessionEdge {
  cursor: String!
  node: Session!
}

type Session {
  id: UUID!
  modality: Modality!
  startedAt: DateTime!
  endedAt: DateTime
  durationSeconds: Int
  status: SessionStatus!
  score: Float
  invalidReasons: [String!]!
  xpEarned: Int!
}

type SyncSessionPayload {
  alreadySynced: Boolean!
  xpEarned: Int!
  userErrors: [UserError!]!
  session: Session
}

type PerformanceRanking {
  entries: [PerformanceRankingEntry!]!
  viewerEntry: PerformanceRankingEntry
}

type PerformanceRankingEntry {
  position: Int!
  totalScore: Float!
  sessionsCounted: Int!
  user: PublicUser!
}

type XpRanking {
  entries: [XpRankingEntry!]!
  viewerEntry: XpRankingEntry
}

type XpRankingEntry {
  position: Int!
  totalXp: Int!
  user: PublicUser!
}

type PublicUser {
  id: ID!
  displayName: String!
  pictureUrl: String
  location: UserLocation
}

