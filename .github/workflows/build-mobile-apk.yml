name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-preview
  cancel-in-progress: false

jobs:
  build-apk:
    name: Validate and build preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install icon generator dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate branded app icons
        run: python scripts/generate-brand-icons.py

      - name: Install mobile dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run typecheck

      - name: Metrics and URL tests
        run: npm run test:metrics

      - name: Validate Expo configuration
        run: npx expo config --type public --json > /tmp/expo-config.json

      - name: Check EAS configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Configure EXPO_TOKEN in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          node -e "const c=require('./app.json').expo; if (!c.extra?.eas?.projectId) { console.error('::error::Este app ainda não está vinculado a um projeto EAS. Execute npx eas-cli@latest init na pasta mobile, confirme o vínculo e envie o projectId em mobile/app.json.'); process.exit(1); }"

      - name: Build APK on Expo EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest build --platform android --profile preview --non-interactive --wait
