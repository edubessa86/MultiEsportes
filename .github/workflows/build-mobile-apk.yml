name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-preview
  cancel-in-progress: false

jobs:
  build-apk:
    name: Validate and build preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install icon generator dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate branded app icons
        run: python scripts/generate-brand-icons.py

      - name: Install mobile dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run typecheck

      - name: Metrics and URL tests
        run: npm run test:metrics

      - name: Validate Expo configuration
        run: npx expo config --type public --json > /tmp/expo-config.json

      - name: Check EAS configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -eu

          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Configure EXPO_TOKEN in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

          echo "Diretório atual: $(pwd)"
          echo "Verificando arquivo app.json..."

          if [ ! -f app.json ]; then
            echo "::error::Arquivo app.json não encontrado no diretório mobile."
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');

          let config;

          try {
            config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          } catch (error) {
            console.error('::error::Não foi possível ler mobile/app.json como JSON válido.');
            console.error(error.message);
            process.exit(1);
          }

          const expo = config.expo;
          const projectId = expo?.extra?.eas?.projectId;
          const expectedProjectId = '776a4864-753a-4275-b07b-a26bfcb4789a';

          console.log('Expo owner:', expo?.owner ?? '(não definido)');
          console.log('Expo slug:', expo?.slug ?? '(não definido)');
          console.log('EAS projectId:', projectId ?? '(não encontrado)');

          if (!projectId) {
            console.error(
              '::error::O campo expo.extra.eas.projectId não foi encontrado em mobile/app.json.'
            );
            process.exit(1);
          }

          if (projectId !== expectedProjectId) {
            console.error(
              '::error::O projectId encontrado não corresponde ao projeto EAS esperado.'
            );
            process.exit(1);
          }

          console.log('Configuração EAS validada com sucesso.');
          NODE

      - name: Build APK on Expo EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest build --platform android --profile preview --non-interactive --wait
